name: Secret Scan

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: failure()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "content": "**Secret found!**\n**Repo:** '${{ github.repository }}'\n**Branch:** '${{ github.ref_name }}'\n**Commit:** '${{ github.sha }}'\n**Workflow:** '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            }'
